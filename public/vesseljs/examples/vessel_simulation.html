<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>SKALA marine — 3D renderer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a1628; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!--
    이 페이지는 **렌더러다. 물리 계산을 하지 않는다.**

    이전 버전에는 표류각·풍경사각·속도손실 추정식이 이 파일 안에 들어 있었다.
    그 결과 (a) 내가 쓴 코드가 MIT 라이선스 벤더 디렉터리에 섞였고,
    (b) Vite가 처리하지 않는 경로라 단위 테스트를 붙일 수 없었다.

    지금은 부모 Vue 앱의 src/physics/가 모든 값을 계산해 postMessage로 내려보내고,
    이 페이지는 받은 자세(heave·pitch·roll·heel·yaw)를 그리기만 한다.

    Vessel.js(MIT, NTNU ShipLab) 원본 모듈은 한 줄도 고치지 않았다.
    여기서는 선체 형상(Ship3D)과 해면(Ocean)만 가져다 쓴다.
  -->
  <script type="module">
    "use strict";

    import * as THREE from "./3D_engine/three_r126.js";
    import { OrbitControls } from "./3D_engine/OrbitControls.js";
    import * as Vessel from "../source/jsm/vessel.js";
    import { Ship3D } from "../source/jsm/3D_engine/Ship3D.js";
    import { Skybox } from "./3D_engine/skybox.js";
    import { Ocean } from "./3D_engine/Regular_ocean.js";

    // ── 부모가 내려보내는 상태. 이 페이지는 이 값을 만들지 않고 받기만 한다. ──
    const view = {
      waveAmplitude: 0.75,   // m (= Hs / 2)
      wavePeriod: 8,         // s
      waveDirection: 180,    // deg
      heading: 0,            // deg, 선수방위
      heaveAmp: 0,           // m
      pitchAmp: 0,           // rad
      rollAmp: 0,            // rad
      heelAngle: 0,          // rad, 풍압 정적 경사
      driftAngle: 0,         // rad
      lateralDrift: 0,       // m/s
      encounterPeriod: 8,    // s — 운동 재생 주기
      showGhost: false,
      quality: "high"        // high | medium | low
    };

    let renderer, camera, controls, scene, zUpCont, ocean, ship3D, ghost, skybox;
    let designDraft = 6.5;
    /** 사용자가 카메라를 직접 조작했는가 — 조작 후에는 자동 프레이밍을 멈춘다 */
    let userMovedCamera = false;

    const QUALITY = {
      high:   { segments: 127, pixelRatioCap: 2,   antialias: true  },
      medium: { segments: 63,  pixelRatioCap: 1.5, antialias: true  },
      low:    { segments: 31,  pixelRatioCap: 1,   antialias: false }
    };

    window.addEventListener("message", (event) => {
      const d = event.data;
      if (!d || d.type !== "RENDER_STATE") return;

      Object.assign(view, d.state || {});

      if (ocean && ocean.waves && ocean.waves.length > 0) {
        ocean.waves[0].A = Math.max(view.waveAmplitude, 0.01);
        ocean.waves[0].T = view.wavePeriod > 0 ? view.wavePeriod : 8;
        ocean.waves[0].theta = view.waveDirection;
      }
      if (ghost) ghost.visible = !!view.showGhost;
      if (renderer && d.state && d.state.quality) applyQuality(d.state.quality);
    });

    function applyQuality(level) {
      const q = QUALITY[level] || QUALITY.high;
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, q.pixelRatioCap));
      onResize();
    }

    (async function main() {
      const container = document.createElement("div");
      Object.assign(container.style, { position: "absolute", inset: "0", width: "100%", height: "100%" });
      document.body.appendChild(container);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setClearColor(0x99aadd);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      scene = new THREE.Scene();
      const oSize = 2048;

      skybox = new Skybox(oSize, "3D_engine/textures/skyboxsun25degtest1.png");
      scene.add(skybox);

      // 조선공학 관례인 z-up 좌표계로 맞춘다.
      THREE.Object3D.DefaultUp.set(0, 0, 1);
      zUpCont = new THREE.Group();
      zUpCont.rotation.x = -0.5 * Math.PI;
      scene.add(zUpCont);

      camera = new THREE.PerspectiveCamera(26, 1, 1, 1.75 * oSize);
      camera.up.set(0, 1, 0);
      camera.position.set(-120, 60, 120);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0);
      controls.minDistance = 50;
      controls.maxDistance = 800;
      controls.update();
      controls.addEventListener("start", () => { userMovedCamera = true; });

      scene.add(new THREE.AmbientLight(0x606070, 0.4));

      ocean = new Ocean({
        size: oSize,
        segments: 127,
        sunDir: skybox.getSun().position.clone().normalize(),
        path: "3D_engine/textures/waternormals.jpg"
      });
      ocean.addCosineWave({ A: view.waveAmplitude, T: view.wavePeriod, theta: view.waveDirection, phi: 0 });
      zUpCont.add(ocean);

      try {
        const spec = await (await fetch("ship_specs/PX121_dbb.json")).json();
        const ship = new Vessel.Ship(spec);
        designDraft = ship.designState.calculationParameters.Draft_design || 6.5;

        ship3D = buildHull(ship, false);
        zUpCont.add(ship3D);

        ghost = buildHull(ship, true);
        ghost.visible = view.showGhost;
        zUpCont.add(ghost);

        // 카메라가 수면 원점이 아니라 선체를 보게 맞춘다.
        // zUpCont가 x축 -90°로 회전돼 있어, 선체의 z = −흘수는 월드 y = −흘수에 해당한다.
        controls.target.set(0, -designDraft / 2, 0);
        controls.update();
        onResize();

        notifyReady();
      } catch (e) {
        console.error("Ship loading error:", e);
      }

      window.addEventListener("resize", onResize);
      onResize();
      setTimeout(onResize, 500);
      setTimeout(onResize, 1500);

      requestAnimationFrame(animate);
    })();

    function buildHull(ship, wireframe) {
      const obj = new Ship3D(ship, { deckOpacity: 0, objectOpacity: 0 });
      // 내부 구조물은 숨기고 선체 외판만 남긴다.
      if (obj.decks) obj.decks.visible = false;
      if (obj.bulkheads) obj.bulkheads.visible = false;
      if (obj.blocks) obj.blocks.visible = false;
      if (wireframe) {
        obj.traverse((child) => {
          if (child.isMesh && child.visible) {
            child.material = new THREE.MeshBasicMaterial({
              color: 0x00a261, wireframe: true, transparent: true, opacity: 0.4
            });
          }
        });
      }
      return obj;
    }

    function onResize() {
      const w = window.innerWidth || 300;
      const h = window.innerHeight || 300;
      if (w < 10 || h < 10) return;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);

      // 세로로 긴 화면(모바일)에서는 같은 화각으로 선체가 잘린다. 카메라를 뒤로 물린다.
      // 사용자가 한 번이라도 직접 돌리거나 확대한 뒤에는 건드리지 않는다.
      if (!userMovedCamera) {
        // 화각 26°에서 거리 190 m면 세로로 약 88 m가 들어온다(LOA 82 m 선체가 화면을 채움).
        // 세로로 긴 화면에서는 가로가 먼저 잘리므로 종횡비로 나눠 같은 폭을 확보한다.
        const BASE_DISTANCE = 190;
        const dist = Math.min(BASE_DISTANCE / Math.min(w / h, 1), controls.maxDistance);
        const dir = camera.position.clone().sub(controls.target).normalize();
        camera.position.copy(controls.target).add(dir.multiplyScalar(dist));
        controls.update();
      }
    }

    function notifyReady() {
      // 부모가 "언제 보내야 하나"를 setTimeout으로 추측하지 않도록 준비 완료를 알린다.
      window.parent.postMessage({ type: "RENDERER_READY" }, "*");
    }

    // ── fps 측정: 부모가 저사양 기기에서 품질을 낮출 판단 근거로 쓴다 ──
    //
    // 탭이 가려지면 브라우저가 requestAnimationFrame을 1 Hz로 낮춘다. 그 값을 그대로 보내면
    // 부모가 "저사양 기기"로 오해해 품질을 떨어뜨린다(실제로 그렇게 동작하는 것을 확인하고 고쳤다).
    // 따라서 가려져 있는 동안의 표본은 보내지 않고, 다시 보일 때 측정 창을 새로 연다.
    let frames = 0;
    let fpsWindowStart = performance.now();

    document.addEventListener("visibilitychange", () => {
      frames = 0;
      fpsWindowStart = performance.now();
    });

    function animate(tMs) {
      requestAnimationFrame(animate);
      const t = tMs / 1000;

      ocean.update(t);

      if (ship3D) {
        // 운동 재생은 조우주기로 한다. 부모가 선속·파향으로 계산해 내려준다.
        const we = (2 * Math.PI) / (view.encounterPeriod > 0 ? view.encounterPeriod : 8);

        ship3D.position.z = -designDraft + view.heaveAmp * Math.cos(we * t);
        ship3D.rotation.y = view.pitchAmp * Math.sin(we * t);
        // 횡동요는 파랑 성분 위에 풍압 정적 경사를 더한다.
        ship3D.rotation.x = view.rollAmp * Math.sin(we * t * 0.7) + view.heelAngle;
        ship3D.rotation.z = -view.driftAngle;
        ship3D.position.x = view.lateralDrift * Math.sin(t * 0.3);

        if (ghost && ghost.visible) {
          // 비교용 유령선: 같은 위치, 정수 중 자세.
          ghost.position.set(0, 0, -designDraft);
          ghost.rotation.set(0, 0, 0);
        }
      }

      controls.update();
      renderer.render(scene, camera);

      frames++;
      const now = performance.now();
      if (now - fpsWindowStart >= 1000) {
        if (!document.hidden) {
          window.parent.postMessage(
            { type: "RENDERER_FPS", fps: Math.round((frames * 1000) / (now - fpsWindowStart)) },
            "*"
          );
        }
        frames = 0;
        fpsWindowStart = now;
      }
    }
  </script>
</body>
</html>
